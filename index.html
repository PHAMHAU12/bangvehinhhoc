<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ensure window.fetch is writable and has a setter so browser extensions can intercept without throwing TypeError
      (function() {
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var _protoFetch = proto.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() { return _protoFetch; },
                set: function(fn) { _protoFetch = fn; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (_) {}
        }

        window.addEventListener('error', function(e) {
          if (e && (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('fetch of #<Window> which has only a getter') !== -1)
          )) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
